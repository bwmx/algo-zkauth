name: Pages

# Publishes the showcase and the sign-in relay for each provider that
# redirects through https to https://bwmx.github.io/algo-zkauth/.
on:
  push:
    branches: [main]
    paths:
      - "apps/showcase/**"
      - "apps/oauth-relay/**"
      # The protocol modules and provider list the showcase and its data script import.
      - "packages/protocol/**"
      # The recorded runs the showcase replays, and the providers' verification keys.
      - "benchmarks/phase6-*.testnet.json"
      - "benchmarks/service-stack.testnet.json"
      - "fixtures/phase3/verification_key.json"
      - "fixtures/slack/verification_key.json"
      - "evidence/write-showcase-data.mjs"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Build the showcase
        run: |
          npm ci --no-audit --no-fund --workspace @algozkauth/showcase --include-workspace-root=false
          npm run build -w @algozkauth/showcase
      # The relay forwards to the provider named by its path, /<provider>-callback/.
      - name: Publish the sign-in relay at /slack-callback/
        run: |
          for provider in slack; do
            mkdir -p "apps/showcase/dist/$provider-callback"
            cp apps/oauth-relay/index.html "apps/showcase/dist/$provider-callback/index.html"
          done
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/showcase/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
