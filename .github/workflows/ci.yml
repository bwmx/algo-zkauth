name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    name: Protocol and interface checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Set up the pinned upstream checkout
        run: npm run setup
      - name: Run the fast checks
        run: npm test
      - name: Install the workspace packages
        run: npm ci
      - name: Test the SDK
        run: npm run test:sdk
      - name: Test the sign-in verifier
        run: npm run test:verify

  apps:
    name: Demo, wallet and example apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --workspace @algozkauth/demo --workspace @algozkauth/wallet --workspace @algozkauth/example-send-algo --include-workspace-root=false
      - name: Typecheck and build the apps
        run: npm run build -w @algozkauth/demo -w @algozkauth/wallet -w @algozkauth/example-send-algo

  showcase:
    name: Showcase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund --workspace @algozkauth/showcase --include-workspace-root=false
      - name: Typecheck and test
        run: npm test -w @algozkauth/showcase
      - name: Build the showcase
        run: npm run build -w @algozkauth/showcase
      - name: Showcase data matches the recorded evidence
        run: git diff --exit-code -- apps/showcase/src/data/
      - name: Showcase data is committed
        run: test -z "$(git status --porcelain -- apps/showcase/src/data/)"
