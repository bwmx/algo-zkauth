# The service stack on Algorand TestNet with real Google sign-in:
#
#   docker compose -f compose.testnet.yaml up --build      (or: npm run stack:testnet:up)
#
# The same images as the local profile in compose.yaml, against public TestNet
# nodes instead of a private LocalNet, and Google instead of the dev issuer. Its
# own project name and volumes keep its accounts and deployments apart from the
# local stack's; the two use the same host ports, so stop one before starting
# the other.
#
# Before the first run:
#   - GOOGLE_CLIENT_ID (in .env or the environment): a Google OAuth client of type
#     Web application whose Authorized JavaScript origins include
#     http://localhost:8765, http://localhost:8770 and http://localhost:8775.
#     The demo, the hosted wallet and the example are separate apps (each its own
#     wallet registry) that share this one client here; real dApps each have their own.
#   - Optional Sign in with Slack: SLACK_CLIENT_ID and SLACK_CLIENT_SECRET (and
#     SLACK_REDIRECT_URI, the https relay https://<owner>.github.io/<repo>/slack-callback/
#     a PKCE-enabled Slack app needs) add a `demo-slack` app on its own Slack
#     deployment; open http://localhost:8765/?app=demo-slack. The relay returns the
#     login to /demo/slack/callback on the demo origin, which hands it to the api.
#     Slack needs its own 1.36 GB proving key.
#   - Funds: on the first run `init` creates admin, sponsor and guardian accounts.
#     With ZKAUTH_FUNDER_MNEMONIC set (in .env: the mnemonic of a TestNet account
#     you hold with about 16 ALGO, such as the demo's TESTNET_MNEMONIC value), it
#     tops them up from that account itself: admin 5, sponsor 10, guardian 0.5
#     ALGO. Only `init` receives it, and it is not written to the state volume.
#     Without it, `init` logs the admin and sponsor addresses with the amounts to
#     send (https://dispenser.testnet.aws.algodev.network/) and waits for them.
#   - Test ALGO for visitors: the api's wallet faucet gives each enrolled wallet
#     1 ALGO once (API_FAUCET_MICROALGOS; at most API_FAUCET_DAILY_MICROALGOS a
#     day), paid by the sponsor, which it never takes below 2 ALGO. After
#     deployment the sponsor's 10 ALGO covers about five visitors (each also
#     costs a 0.45 ALGO enrollment deposit); send the sponsor more for more.
#     Set API_FAUCET_MICROALGOS=0 to turn the faucet off.
#
# Give Docker at least 6 GB of memory (a proof peaks near 3 GB). Every published
# port binds to the host's loopback only. See docs/service-architecture.md.

name: algozkauth-testnet

x-testnet-env: &testnet-env
  ZKAUTH_NETWORK: testnet
  ZKAUTH_STATE_DIR: /state
  ZKAUTH_PROVER_URL: http://prover:8781

services:
  # One-shot: accounts (funded from ZKAUTH_FUNDER_MNEMONIC, or waits for
  # funding), proving artifacts, the Google deployment and its current keys,
  # then the demo, example and shared wallet apps. Idempotent: on later runs it
  # verifies the existing records on chain and sends nothing to funded accounts.
  init:
    build: { context: ., dockerfile: services/keysync/Dockerfile }
    environment:
      <<: *testnet-env
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env (see compose.testnet.yaml)}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-}
      # Optional: the account init funds the others from. Given to this service only.
      ZKAUTH_FUNDER_MNEMONIC: ${ZKAUTH_FUNDER_MNEMONIC:-}
    command:
      - sh
      - -ec
      - |
        zkauth() { tools/cli/zkauth "$$@"; }
        if [ -n "$$ZKAUTH_FUNDER_MNEMONIC" ]; then
          zkauth init --fund-from ZKAUTH_FUNDER_MNEMONIC
        else
          zkauth init --wait
        fi
        zkauth artifacts fetch google
        zkauth deploy provider google
        # Before the registry is sealed, Google's current keys take effect at once;
        # this first sync then seals it, and keysync keeps it current.
        zkauth keys sync google
        for app in demo:8765 example:8775 wallet:8770; do
          id=$${app%%:*}; port=$${app##*:}
          zkauth apps add "$$id" --provider google --client-id "$$GOOGLE_CLIENT_ID" --origin "http://localhost:$$port" $$([ "$$id" = wallet ] && echo --shared)
          zkauth deploy app "$$id"
        done
        # Optional: Sign in with Slack on its own deployment, for the demo page only.
        if [ -n "$$SLACK_CLIENT_ID" ]; then
          zkauth artifacts fetch slack
          zkauth deploy provider slack
          zkauth keys sync slack
          zkauth apps add demo-slack --provider slack --client-id "$$SLACK_CLIENT_ID" --origin http://localhost:8765 --client-secret-env SLACK_CLIENT_SECRET $${SLACK_REDIRECT_URI:+--redirect-uri "$$SLACK_REDIRECT_URI"}
          zkauth deploy app demo-slack
        fi
    volumes:
      - state:/state
      - fixtures:/app/fixtures

  prover:
    build: { context: ., dockerfile: services/prover/Dockerfile }
    command: ["node", "--env-file-if-exists=/state/secrets.env", "services/prover/src/server.ts"]
    volumes:
      - state:/state:ro
      - fixtures:/app/fixtures:ro
    depends_on:
      init: { condition: service_completed_successfully }

  keysync:
    build: { context: ., dockerfile: services/keysync/Dockerfile }
    command: [ "node", "--env-file-if-exists=/state/secrets.env", "--import", "./upstream/snarkjs-algorand/node_modules/tsx/dist/loader.mjs", "services/keysync/src/main.ts" ]
    environment: *testnet-env
    volumes:
      - state:/state
      - fixtures:/app/fixtures:ro
    depends_on:
      init: { condition: service_completed_successfully }

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    command: ["node", "--env-file-if-exists=/state/secrets.env", "--import", "./upstream/snarkjs-algorand/node_modules/tsx/dist/loader.mjs", "services/api/src/server.ts"]
    environment:
      <<: *testnet-env
      ZKAUTH_API_PUBLIC_URL: http://localhost:8780
      # The wallet faucet: 1 ALGO once per enrolled wallet, at most 10 ALGO a day, from the sponsor.
      API_FAUCET_MICROALGOS: ${API_FAUCET_MICROALGOS:-1000000}
      API_FAUCET_DAILY_MICROALGOS: ${API_FAUCET_DAILY_MICROALGOS:-10000000}
      # Exchanges Slack's authorization code (only with the optional demo-slack app).
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
    volumes:
      - state:/state:ro
      - fixtures:/app/fixtures:ro
    ports:
      - "127.0.0.1:8780:8780"
    depends_on:
      init: { condition: service_completed_successfully }
      prover: { condition: service_healthy }

  # The demo app (http://localhost:8765), the hosted wallet (http://localhost:8770)
  # and the send-algo example (http://localhost:8775, hosted mode at /hosted.html).
  web:
    build: { context: ., dockerfile: apps/Dockerfile }
    ports:
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:8770:8770"
      - "127.0.0.1:8775:8775"
    depends_on:
      api: { condition: service_healthy }

  # The example backend (http://localhost:8785): verifies sign-ins against a
  # public TestNet node, trusting no AlgoZKAuth service.
  example-backend:
    build: { context: ., dockerfile: apps/Dockerfile }
    command: ["node", "examples/backend/server.ts"]
    environment:
      BIND: 0.0.0.0
      ALGOD_URL: https://testnet-api.algonode.cloud
      ALGOD_TOKEN: ""
      ZKAUTH_SERVICE: http://api:8780
      ZKAUTH_APPS: example,wallet
      ALLOWED_ORIGINS: http://localhost:8775
    ports:
      - "127.0.0.1:8785:8785"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8785/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      retries: 20
    depends_on:
      api: { condition: service_healthy }

volumes:
  state:
  fixtures:
