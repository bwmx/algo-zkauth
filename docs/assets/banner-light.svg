<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">AlgoZKAuth</title>
  <desc id="d">Sign in with Google or Slack. A zero-knowledge proof authorizes an Algorand wallet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#cbd5e1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Logo -->
    <g transform="translate(88 82) scale(1.75)">
      <rect width="64" height="64" rx="14" fill="url(#accent)"/>
      <circle cx="21" cy="32" r="9" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M30 32h22M45 32v8M52 32v6" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Wordmark -->
    <text x="232" y="144" font-size="76" font-weight="800" letter-spacing="-2" fill="#0f172a">Algo<tspan fill="url(#accent)">ZK</tspan>Auth</text>
    <text x="236" y="192" font-size="27" font-weight="500" fill="#475569">Sign in with Google or Slack. Control an Algorand wallet.</text>
    <!-- Flow -->
    <g font-size="17" font-weight="600" fill="#0f172a" transform="translate(236 222)">
      <rect width="236" height="40" rx="20" fill="#ffffff" stroke="#c7d2fe"/>
      <text x="118" y="26" text-anchor="middle">Google or Slack login</text>
      <path d="M248 20h28m-8-6 8 6-8 6" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="288" width="232" height="40" rx="20" fill="#ffffff" stroke="#c7d2fe"/>
      <text x="404" y="26" text-anchor="middle">Zero-knowledge proof</text>
      <path d="M532 20h28m-8-6 8 6-8 6" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="572" width="200" height="40" rx="20" fill="#ffffff" stroke="#c7d2fe"/>
      <text x="672" y="26" text-anchor="middle">Algorand wallet</text>
    </g>
    <text x="1216" y="52" text-anchor="end" font-size="15" font-weight="600" letter-spacing="1.5" fill="#475569">TESTNET PROOF OF CONCEPT</text>
  </g>
</svg>
