# Two ways to run AlgoZKAuth in Docker:
#
#   docker compose --profile local up --build
#     The full service stack on a private LocalNet with the dev issuer: no Google
#     client, no TestNet ALGO. The first run downloads the 1.4 GB proving key.
#     See docs/service-architecture.md.
#
#   docker compose run --rm --service-ports demo
#     The original single-process TestNet demo (scripts/demo/quickstart.sh).
#
# Give Docker at least 6 GB of memory for the local stack (a proof peaks near 3 GB).
# Every published port binds to the host's loopback only.

x-local-env: &local-env
  ZKAUTH_NETWORK: localnet
  ZKAUTH_STATE_DIR: /state
  ZKAUTH_ALGOD_URL: http://algod:8080
  ZKAUTH_ALGOD_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  ZKAUTH_KMD_URL: http://algod:7833
  ZKAUTH_KMD_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  ZKAUTH_DEV_ISSUER_URL: http://dev-issuer:8790
  ZKAUTH_DEV_ISSUER_PUBLIC_URL: http://localhost:8790
  ZKAUTH_PROVER_URL: http://prover:8781

# Secrets are generated by `zkauth init` into the state volume, so long-running
# services read them at start (node --env-file-if-exists) rather than from this file.

services:
  algod:
    profiles: [local]
    image: algorand/algod:latest
    init: true
    environment:
      START_KMD: 1
      TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      ADMIN_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      KMD_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      GOSSIP_PORT: 10000
    volumes:
      - ./compose/local/algod_config.json:/etc/algorand/config.json:ro
      - ./compose/local/algod_network_template.json:/etc/algorand/template.json:ro
      # The chain (network.json, node data, KMD wallets) lives next to the
      # deployment records in `state`, so `down` and `up` keep both; `down -v`
      # clears both.
      - algod:/algod
    ports:
      # Not 4001/4002, so AlgoKit's own LocalNet can run alongside.
      - "127.0.0.1:4101:8080"
      - "127.0.0.1:4102:7833"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'X-KMD-API-Token: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' http://localhost:7833/v1/wallets >/dev/null && curl -sf http://localhost:8080/health >/dev/null"]
      interval: 3s
      retries: 40

  dev-issuer:
    profiles: [local]
    build: { context: ., dockerfile: services/dev-issuer/Dockerfile }
    depends_on:
      algod: { condition: service_healthy }
    environment:
      ZKAUTH_NETWORK: localnet
      DEV_ISSUER_URL: http://localhost:8790
      # Tokens follow the LocalNet block clock, which can drift from wall time.
      DEV_ISSUER_ALGOD_URL: http://algod:8080
      DEV_ISSUER_ALGOD_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    volumes:
      - dev-issuer-state:/state
    ports:
      - "127.0.0.1:8790:8790"

  # One-shot: proving artifacts, accounts, the demo app, deployments and the dev key.
  init:
    profiles: [local]
    build: { context: ., dockerfile: services/keysync/Dockerfile }
    environment: *local-env
    # Three apps on one provider deployment, each with its own audience and wallet
    # registry: the demo, the example dApp and the shared hosted wallet.
    command: ["sh", "-c", "tools/cli/zkauth artifacts fetch google && tools/cli/zkauth up --local && tools/cli/zkauth apps add example --provider google --client-id dev-example --origin http://localhost:8775 && tools/cli/zkauth deploy app example && tools/cli/zkauth apps add wallet --provider google --client-id dev-wallet --origin http://localhost:8770 --shared && tools/cli/zkauth deploy app wallet"]
    volumes:
      - state:/state
      - fixtures:/app/fixtures
    depends_on:
      algod: { condition: service_healthy }
      dev-issuer: { condition: service_healthy }

  prover:
    profiles: [local]
    build: { context: ., dockerfile: services/prover/Dockerfile }
    command: ["node", "--env-file-if-exists=/state/secrets.env", "services/prover/src/server.ts"]
    volumes:
      - state:/state:ro
      - fixtures:/app/fixtures:ro
    depends_on:
      init: { condition: service_completed_successfully }

  keysync:
    profiles: [local]
    build: { context: ., dockerfile: services/keysync/Dockerfile }
    command: [ "node", "--env-file-if-exists=/state/secrets.env", "--import", "./upstream/snarkjs-algorand/node_modules/tsx/dist/loader.mjs", "services/keysync/src/main.ts" ]
    environment:
      <<: *local-env
      KEYSYNC_INTERVAL_SECONDS: 300
    volumes:
      - state:/state
      - fixtures:/app/fixtures:ro
    depends_on:
      init: { condition: service_completed_successfully }

  api:
    profiles: [local]
    build: { context: ., dockerfile: services/api/Dockerfile }
    command: ["node", "--env-file-if-exists=/state/secrets.env", "--import", "./upstream/snarkjs-algorand/node_modules/tsx/dist/loader.mjs", "services/api/src/server.ts"]
    environment:
      <<: *local-env
      ZKAUTH_API_PUBLIC_URL: http://localhost:8780
      # What the SDK in the browser reads the chain from.
      ZKAUTH_PUBLIC_ALGOD_URL: http://localhost:4101
    volumes:
      - state:/state:ro
      - fixtures:/app/fixtures:ro
    ports:
      - "127.0.0.1:8780:8780"
    depends_on:
      init: { condition: service_completed_successfully }
      prover: { condition: service_healthy }

  # The demo app (http://localhost:8765), the hosted wallet (http://localhost:8770)
  # and the send-algo example (http://localhost:8775, hosted mode at /hosted.html).
  web:
    profiles: [local]
    build: { context: ., dockerfile: apps/Dockerfile }
    ports:
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:8770:8770"
      - "127.0.0.1:8775:8775"
    depends_on:
      api: { condition: service_healthy }

  # The original single-process TestNet demo. It runs scripts/demo/quickstart.sh
  # against the checkout; the container runs as uid 1000 (the image's node
  # user), so on a Linux host whose user has another uid add user: "<uid>:<gid>".
  demo:
    profiles: [quickstart]
    build: { context: ., dockerfile: scripts/demo/Dockerfile }
    # A terminal is needed to prompt for the Google client ID and wait for funding.
    stdin_open: true
    tty: true
    environment:
      # Optional: skips the client ID prompt on first run.
      GOOGLE_CLIENT_ID:
    ports:
      # The demo signs transfers; keep it reachable only from this computer.
      - "127.0.0.1:8765:8765"
    volumes:
      - .:/app
      # Linux-built dependencies stay out of the checkout, so a native run is unaffected.
      - upstream:/app/upstream
      - app-modules:/app/web/app/node_modules

volumes:
  algod:
  state:
  fixtures:
  dev-issuer-state:
  upstream:
  app-modules:
