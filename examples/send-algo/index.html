<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Send ALGO with a login</title>
  <body style="font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px">
    <h1>Send ALGO with a login</h1>
    <button id="go">Sign in and create a wallet</button>
    <p id="wallet"></p>
    <form id="send" hidden><input id="to" placeholder="Recipient address" size="60" /> <button>Send 0.1 ALGO</button></form>
    <p><button id="backend" hidden>Sign in to the example backend</button> <span id="backend-user"></span></p>
    <pre id="log"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
